<html>
    <head>
        <script src = "https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            body {
                background-color: #f4f1e6;
                color: #223328;
                font-family: Arial, sans-serif;
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 15px;
            }
            body::before {
                content: "Sign in";
                font-size: 28px;
                font-weight: bold;
                margin-bottom: 10px;
            }
            input {
                width: 300px;
                padding: 10px;
                font-size: 15px;
                background-color: #ffffff;
                color: #223328;
                border: 1px solid #d9d3bd;
                border-radius: 8px;
            }
            input:focus {
                outline: 2px solid #2f6f5e;
            }
            button:hover {
                opacity: 0.9;
            }
        </style>
    </head>

    <body>
        <input id ="username" type = "text" placeholder = "Username">
        <input id ="password" type = "text" placeholder = "Password">

        <div>
         <button onclick = "signin()" style="background-color: #4285F4; color: white; border: none; border-radius: 20px; padding: 12px 30px; cursor: pointer; font-size: 16px;">Submit</button>
        </div>
    </body>

    <script>
    async function signin(){
        const username = document.getElementById("username").value
        const password = document.getElementById("password").value

        const response = await axios.post("/signin" , {
            username , password
        })

        const token = response.data.token
        localStorage.setItem("token", token)

        window.location = '/'
    }
    </script>
</html>
