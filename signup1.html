<html>
    <head>
        <script src = "https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            body {
                background-color: #f4f1e6;
                color: #223328;
                font-family: Arial, sans-serif;
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            body::before {
                content: "Create your account";
                font-size: 28px;
                font-weight: bold;
                margin-bottom: 10px;
            }
            input {
                background-color: #ffffff;
                color: #223328;
                font-size: 15px;
            }
            input:focus {
                outline: 2px solid #2f6f5e;
            }
            button:hover {
                opacity: 0.9;
            }
        </style>
    </head>

    <body>
        <input style = "width:400px; padding:6px; margin:10px; border-radius: 6px; border: 1px solid #e5e5e5;" id ="username" type = "text" placeholder = "Username">
        <input style = "width:400px; padding:6px; margin:10px; border-radius: 6px; border: 1px solid #e5e5e5;" id = "password" type = "text" placeholder = "Password">

        <div>
         <button onclick = "signup()" style="background-color: #4285F4; color: white; border: none; border-radius: 20px; padding: 12px 30px; cursor: pointer; font-size: 16px;">Submit</button>
        </div>
    </body>

    <script>
    async function signup(){
        const username = document.getElementById("username").value
        const password = document.getElementById("password").value

        const response = await axios.post("/signup" , {
            username , password
        })

        window.location = '/signin'
    }
    </script>
</html>
