<html>
    <head>
        <script src = "https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            body {
                background-color: #f4f1e6;
                color: #223328;
                font-family: Arial, sans-serif;
                margin: 0;
                padding-top: 50px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            body::before {
                content: "Personal Expense Tracker";
                font-size: 28px;
                font-weight: bold;
                margin-bottom: 20px;
            }
            input {
                background-color: #ffffff;
                color: #223328;
                font-size: 15px;
            }
            input:focus {
                outline: 2px solid #2f6f5e;
            }
            button {
                background-color: #2f6f5e;
                color: #ffffff;
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                font-size: 15px;
                cursor: pointer;
                margin: 5px;
            }
            button:hover {
                background-color: #1f5346;
            }
            #response {
                width: 414px;
                margin-top: 20px;
            }
            #response div {
                background-color: #ffffff;
                border: 1px solid #d9d3bd;
                border-radius: 8px;
                padding: 10px;
                margin-bottom: 10px;
            }
            #total {
                font-size: 20px;
                font-weight: bold;
                color: #2f6f5e;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <input style = "width:400px; padding:6px; margin:10px; border-radius: 6px; border: 1px solid #e5e5e5; " id ="first" type= "text" placeholder = "items">
        <input style = "width:400px; padding:6px; margin:10px; border-radius: 6px; border: 1px solid #e5e5e5;" id = "second" type= "text" placeholder = "amount">

        <div>
        <button onclick = "expense()">Submit</button>
        <button onclick = "total()">total amount</button>
        </div>

        <div id = "response"></div>
        <div id = "total"></div>

   <script>

   async function expense(){
    const items = document.getElementById("first").value
    const amount = document.getElementById("second").value

    const responses = await axios.post("/expense",
        {
            items : items,
            amount : amount
        },
        { headers: { token: localStorage.getItem("token") } }
    )

    total()
   }


   async function total(){
    const response = await axios.get("/expense", {
        headers : {
            token : localStorage.getItem("token")
        }
    });

    document.getElementById("total").innerHTML = "Total:" + response.data.total;
   }

   </script>
    </body>
</html>
